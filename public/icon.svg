<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3A3A3A" />
      <stop offset="100%" stop-color="#1E1E1E" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F4C7B8" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>
  
  <!-- Outer Rounded Container -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bgGrad)" />
  <rect x="20" y="20" width="472" height="472" rx="108" fill="none" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="4" />
  
  <!-- "H" Emblem Monogram -->
  <g filter="url(#shadow)">
    <!-- Left Vertical Stem -->
    <rect x="132" y="112" width="68" height="288" rx="16" fill="url(#textGrad)" />
    
    <!-- Right Vertical Stem -->
    <rect x="312" y="112" width="68" height="288" rx="16" fill="url(#textGrad)" />
    
    <!-- Horizontal Crossbar -->
    <rect x="180" y="222" width="152" height="68" rx="12" fill="url(#textGrad)" />
    
    <!-- Rose Gold Top Roof Accent Line on Crossbar -->
    <path d="M 256 182 L 302 222 L 210 222 Z" fill="#F4C7B8" opacity="0.9" />
  </g>
</svg>
