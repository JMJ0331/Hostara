<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3A3A3A" />
      <stop offset="100%" stop-color="#1E1E1E" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F4C7B8" />
      <stop offset="100%" stop-color="#E8B4A2" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E5E5E5" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>
  
  <!-- Outer Rounded Container -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bgGrad)" />
  <rect x="20" y="20" width="472" height="472" rx="108" fill="none" stroke="#FFFFFF" stroke-opacity="0.1" stroke-width="4" />
  
  <!-- Subtle Background Building Geometry -->
  <path d="M 120 380 L 120 220 L 256 120 L 392 220 L 392 380 Z" fill="none" stroke="url(#accentGrad)" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" opacity="0.4" />
  
  <!-- Main Hostara Emblem: Modern Luxury Villa Structure -->
  <g filter="url(#shadow)">
    <!-- Main Villa Body -->
    <path d="M 140 370 L 140 230 L 256 140 L 372 230 L 372 370 Z" fill="url(#goldGrad)" />
    
    <!-- Arch / Entrance Cutout -->
    <path d="M 216 370 L 216 280 C 216 257.9 233.9 240 256 240 C 278.1 240 296 257.9 296 280 L 296 370 Z" fill="#1E1E1E" />
    
    <!-- Roof Accent / Peak Badge -->
    <polygon points="256,96 388,200 372,216 256,124 140,216 124,200" fill="url(#accentGrad)" />
    
    <!-- Windows Grid -->
    <rect x="172" y="250" width="28" height="36" rx="6" fill="#1E1E1E" opacity="0.85" />
    <rect x="312" y="250" width="28" height="36" rx="6" fill="#1E1E1E" opacity="0.85" />
    
    <!-- Stars / Sparkles (iCal Sync indicator) -->
    <path d="M 370 120 L 376 136 L 392 142 L 376 148 L 370 164 L 364 148 L 348 142 L 364 136 Z" fill="url(#accentGrad)" />
  </g>
  
  <!-- Hostara Lettermark "H" Accent at bottom -->
  <text x="256" y="440" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="800" fill="#FFFFFF" letter-spacing="6" text-anchor="middle" opacity="0.9">HOSTARA</text>
</svg>
